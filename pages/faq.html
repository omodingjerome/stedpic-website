<header class="page-head">
  <div class="inner">
    <span class="section-label">Frequently Asked Questions</span>
    <h1>Straight answers, before you spend a cent.</h1>
    <p class="lead">What diaspora buyers and owners ask us most. Can't find yours? Ask us directly — a real person will respond.</p>
  </div>
</header>

<main class="page-body">
  <div class="narrow">
    <div class="faq-tools">
      <div class="faq-search">
        {{icon:search}}
        <input id="faq-q" type="search" placeholder="Search questions…" aria-label="Search questions" autocomplete="off">
      </div>
      <div class="pills" id="faq-cats" role="group" aria-label="Filter by topic" hidden></div>
      <p class="faq-count" id="faq-count" aria-live="polite"></p>
    </div>
    <div id="faq-list" aria-busy="true"></div>

    <div class="faq-cta">
      <div>
        <h3>Still have a question?</h3>
        <p>Book a free 20-minute call, or message us on WhatsApp.</p>
      </div>
      <a class="btn-primary" href="book.html">Book a free call →</a>
    </div>
  </div>
</main>
